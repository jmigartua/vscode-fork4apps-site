<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!-- KaTeX auto-render: publication titles carry TeX inside generated HTML that
     Quarto's own math pipeline never sees (same approach as thermomat). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
/* The header ribbon is sticky; the side columns and anchor targets need its height. */
(function () {
  function headH() {
    var t = document.querySelector(".topline"), h = document.querySelector(".site-head");
    var px = (t ? t.offsetHeight : 0) + (h ? h.offsetHeight : 0);
    if (px) document.documentElement.style.setProperty("--head-h", px + "px");
  }
  document.addEventListener("DOMContentLoaded", headH);
  window.addEventListener("load", headH);
  window.addEventListener("resize", headH);
})();
document.addEventListener("DOMContentLoaded", function () {
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false }],
      throwOnError: false
    });
  }
  /* Quarto's KaTeX pipeline writes <span class="math inline">TeX</span> without delimiters and renders
     them in a loop that reads firstChild.data; that loop dies at the first span the auto-render above
     has already turned into KaTeX markup, leaving every later formula raw. Render the rest here. */
  if (window.katex) {
    document.querySelectorAll(".math").forEach(function (el) {
      if (!el.querySelector(".katex")) {
        var t = el.textContent.replace(/^\s*\\[\(\[]/, "").replace(/\\[\)\]]\s*$/, "");
        try { katex.render(t, el, { displayMode: el.classList.contains("display"), throwOnError: false }); } catch (e) {}
      }
      /* Quarto's loop would still visit this span and wipe it (firstChild is now an element, not text):
         take it out of its sight. No stylesheet of the site depends on the class; KaTeX's own output carries the layout. */
      el.classList.remove("math"); el.classList.add("math-done");
    });
  }
});
</script>
